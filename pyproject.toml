[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ascii-rpg"
version = "0.1.0"
description = "A colorful full-screen ASCII-style space RPG."
requires-python = ">=3.10"
dependencies = ["pygame>=2.5"]

[project.scripts]
ascii-rpg = "ascii_rpg.main:main"

[tool.setuptools.packages.find]
where = ["src"]
